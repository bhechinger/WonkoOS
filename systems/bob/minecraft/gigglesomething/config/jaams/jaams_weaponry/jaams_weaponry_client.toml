		backgroundTransparency = "TRANSPARENT"
		#Border color for the overlay
		#Allowed Values: BLACK, WHITE, LIGHT_GRAY, DARK_GRAY, RED, GREEN, BLUE, PINK, ORANGE, LAVENDER, MINT, SANDY_BEIGE, GOLDEN, OLIVE, PALE_YELLOW, LIGHT_BROWN, BROWN, CYAN, PURPLE, TEAL, BEIGE, TURQUOISE, FUCHSIA
