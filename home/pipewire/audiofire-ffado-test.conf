context.properties = {
  link.max-buffers = 16
  core.daemon = true
  core.name = pipewire-0

  default.clock.rate = 48000
  default.clock.allowed-rates = [ 48000 ]
  default.clock.quantum = 1024
  default.clock.min-quantum = 1024
  default.clock.max-quantum = 1024
  default.clock.quantum-limit = 8192
}

context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.* = support/libspa-support
}

context.modules = [
  {
    name = libpipewire-module-rt
    args = {
      nice.level = -11
      rt.prio = 88
    }
    flags = [ ifexists nofail ]
  }

  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-profiler }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-access }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }

  {
    name = libpipewire-module-ffado-driver
    args = {
      driver.mode = duplex
      ffado.devices = [ "hw:0" ]
      ffado.period-size = 1024
      ffado.period-num = 3
      ffado.sample-rate = 48000
      ffado.realtime = true
      ffado.rtprio = 88
      sink.props = {
        node.name = "audiofire_ffado_test_output"
        node.description = "AudioFire4 FFADO Test Output"
        priority.driver = 10
        priority.session = 10
      }
      source.props = {
        node.name = "audiofire_ffado_test_input"
        node.description = "AudioFire4 FFADO Test Input"
        priority.driver = 10
        priority.session = 10
      }
    }
    flags = [ ifexists nofail ]
  }
]
