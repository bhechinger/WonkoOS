	["Gun System Client Handler"."Gun Storage Overlay Settings"]
		#Overlay position on the screen
		#Allowed Values: TOP, BOTTOM
		"Overlay Position" = "BOTTOM"
		#Enable or disable bullet render on Overlay
		"Show Gun Storage Overlay" = true
		#Enable background for the overlay
		backgroundEnabled = true
		#Background color for the overlay
