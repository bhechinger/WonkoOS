monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.usb-HD_Web_Camera_HD_Web_Camera_Ucamera001-02.mono-fallback"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_(input|output).hw_Controller_0"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1
      }
    }
  }
]
