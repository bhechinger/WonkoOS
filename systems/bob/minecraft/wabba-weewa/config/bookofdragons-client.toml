
#Book of Dragons Client Settings
[client]
	#Sprint mode while riding dragons
	#HOLD: Sprint while holding the sprint key (like vanilla)
	#TOGGLE: Press to start sprinting, press again to stop
	#Allowed Values: HOLD, TOGGLE
	sprintMode = "TOGGLE"
	#Enable camera roll while riding dragons
	#Set to false to disable for motion sickness accessibility
	cameraRollEnabled = true
	#Third person camera distance when riding dragons
	#Range: 4.0 ~ 100.0
	thirdPersonDistance = 8.0
	#FOV offset for first-person view while riding
	#Range: -50.0 ~ 50.0
	firstPersonFovOffset = 0.0
	#Enable barrel roll with A/D keys while flying
	#When true: A/D causes the dragon to roll left/right
	#When false: A/D applies yaw (turn left/right) with natural banking
	barrelRollEnabled = true
	#Enable speed-based FOV effects while flying
	speedFovEffectEnabled = true
	#Multiplier for the speed-based FOV effect
	#Range: 0.0 ~ 10.0
	speedFovEffectStrength = 1.0
	#Dragon flight mouse sensitivity multiplier
	#Applied on top of vanilla camera sensitivity after normalisation.
	#Increase if dragon controls feel too heavy (e.g. Raw Input disabled,
	#remote desktop, or low-DPI mouse with non-default pointer speed).
	#Default 1.0 = same feel as before for players with Raw Input enabled.
	#Range: 0.1 ~ 10.0
	dragonMouseSensitivity = 1.0
	#Preferred camera perspective when mounting a dragon
	#FIRST_PERSON: First-person view
	#THIRD_PERSON: Third-person view (behind the dragon)
	#Allowed Values: FIRST_PERSON, THIRD_PERSON
	ridingCameraPerspective = "THIRD_PERSON"
	#When true, remembers the last camera perspective used while riding
	#and restores it on the next mount instead of always switching to the preferred one
	rememberLastCameraPerspective = false
	#Enable loose-follow camera for 3D barrel-roll flight (third-person only).
	#When true, the third-person camera lags slightly behind the dragon's rotation
	#with a small overshoot on settle, giving a cinematic feel.
	#Has no effect in first-person or 2D flight mode.
	dragonCameraLooseFollow = true
	#Cinematic Camera: Rotation Stiffness
	#Range: 0.0 ~ 100.0
	cinematicRotStiffness = 30.0
	#Cinematic Camera: Rotation Damping
	#Range: 0.0 ~ 100.0
	cinematicRotDamping = 15.0
	#Cinematic Camera: Position Stiffness
	#Range: 0.0 ~ 100.0
	cinematicPosStiffness = 30.0
	#Cinematic Camera: Position Damping
	#Range: 0.0 ~ 100.0
	cinematicPosDamping = 15.0
	#Cinematic Camera: Rotation Looseness
	#Range: 0.0 ~ 1.0
	cinematicRotLooseness = 0.5
	#Cinematic Camera: Position Looseness (Lateral)
	#Range: 0.0 ~ 1.0
	cinematicPosLoosenessLateral = 0.5
	#Cinematic Camera: Position Looseness (Forward)
	#Range: 0.0 ~ 1.0
	cinematicPosLoosenessForward = 0.125
	#Write the Book of Dragons in upright letters instead of the slanted hand
	readableBookFont = false
	#Mark the class ribbons and species pages of the Book of Dragons that hold something new
	bookNewMarks = true
	#Show what a wild dragon asks of you when you look at it
	askPopups = true
	#Seconds before the same ask shows again when you look away and back
	#Range: 0.0 ~ 120.0
	askRepeatSeconds = 10.0
	#Procedural animation on dragons: tail and neck physics, the body tilting to
	#the ground and the legs reaching for it. Off, dragons play their animations
	#as a distant dragon does
	proceduralRigEnabled = true
	#Shake the camera in the buffeting of fast flight and dives
	turbulenceEnabled = true
	#Multiplier for the turbulence shake
	#Range: 0.0 ~ 3.0
	turbulenceStrength = 1.0
	#Draw streaks of air rushing past the rider at speed
	speedLinesEnabled = true
	#Stuffed toys squeak when squeezed, hit or bounced
	plushSoundsEnabled = true
	#Seconds for the camera to turn 90 degrees entering or leaving free look
	#Range: 0.1 ~ 3.0
	viewSwingSeconds = 0.5
	#The dragons drawn in the NBD style; every other dragon is drawn in the BOD style
	nbdDragons = []

	#Third-person crosshair
	[client.playerReticle]
		shown = true
		#cross, dot, circle, ring_dot, brackets, chevron, or a texture in textures/gui/reticle/
		style = "chevron"
		#Colour as #RRGGBB
		color = "#FFFFFF"
		#Width in GUI pixels
		#Range: 4.0 ~ 48.0
		size = 9.0
		#Range: 0.1 ~ 1.0
		opacity = 1.0

